services:
  - type: web
    name: support-bridge
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/puppeteer-cache
      - key: USE_BUNDLED_CHROMIUM
        value: "1"
