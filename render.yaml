services:
  - type: web
    name: support-bridge
    runtime: node
    buildCommand: rm -rf /opt/render/project/src/puppeteer-cache && npm install && PUPPETEER_CACHE_DIR=/opt/render/project/src/puppeteer-cache npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/puppeteer-cache
