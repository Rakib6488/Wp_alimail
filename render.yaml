services:
  - type: web
    name: support-bridge
    runtime: node
    buildCommand: rm -rf /opt/render/project/src/puppeteer-cache && npm install && export PUPPETEER_CACHE_DIR=/opt/render/project/src/puppeteer-cache && node scripts/install-chrome.js && test -x "$(find \"$PUPPETEER_CACHE_DIR\" -type f -name chrome -print -quit)"
    startCommand: npm start
    envVars:
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/puppeteer-cache
