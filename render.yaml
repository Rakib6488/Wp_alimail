services:
  - type: web
    name: support-bridge
    runtime: node
    buildCommand: rm -rf /opt/render/.cache/puppeteer && npm install && npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
