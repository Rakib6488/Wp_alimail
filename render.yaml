services:
  - type: web
    name: support-bridge
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NO_MAIL
        value: "0"
      - key: SMTP_PORT
        value: "587"
      - key: PORT
        value: 10000
